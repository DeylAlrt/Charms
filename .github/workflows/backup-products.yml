# Every day, saves a copy of the products from Supabase into
# src/data/products-backup.json (only when something changed). The builder
# uses that copy if Supabase can't be reached.
name: Back up products

on:
  schedule:
    - cron: '0 2 * * *'   # every day at 06:00 Dubai time
  workflow_dispatch: {}    # or run it any time from the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/backup-products.mjs
      - name: Save the copy if it changed
        run: |
          if git diff --quiet -- src/data/products-backup.json; then
            echo "No changes."
          else
            git config user.name "Product backup"
            git config user.email "actions@users.noreply.github.com"
            git add src/data/products-backup.json
            git commit -m "Back up products from Supabase"
            git push
          fi
